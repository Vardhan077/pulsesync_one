services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulsesync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsesync
      POSTGRES_USER: pulsesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pulsesync_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsesync -d pulsesync"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pulsesync_pgdata:
